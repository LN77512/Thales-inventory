<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THALES - Information Systems</title>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Caminho absoluto corrigido para o GitHub Pages -->
    <link rel="stylesheet" href="/Thales-inventory/style.css">
</head>
<body>

    <!-- Tela de Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>THALES</h2>
            <p>INFORMATION SYSTEMS</p>
            <p class="login-subtitle">Insira suas credenciais para aceder</p>
            
            <label for="usuarioInput">Nome de Utilizador / E-mail:</label>
            <input type="email" id="usuarioInput" placeholder="ex: thalesgroup@gmail.com">

            <label for="senhaInput">Palavra-passe:</label>
            <input type="password" id="senhaInput" placeholder="********">

            <button onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <!-- Conteúdo Principal do Inventário -->
    <div class="container">
        <h1>THALES</h1>
        <h2>INFORMATION SYSTEMS</h2>

        <div class="form-group">
            <label>Nome do Equipamento:</label>
            <input type="text" id="nomeEquipamento" placeholder="Ex: Computador Dell">
            
            <label>Categoria:</label>
            <input type="text" id="categoriaEquipamento" placeholder="Ex: TI, Ferramentas">
            
            <label>Status:</label>
            <select id="statusEquipamento">
                <option value="Disponível">Disponível</option>
                <option value="Em uso">Em uso</option>
                <option value="Manutenção">Manutenção</option>
            </select>
            
            <label>Responsável:</label>
            <input type="text" id="responsavelEquipamento" placeholder="Deixe vazio se indisponível">

            <button onclick="adicionarEquipamento()" class="btn-add">Adicionar Equipamento</button>
        </div>

        <h3>Lista de Equipamentos</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Status</th>
                    <th>Responsável</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaEquipamentos">
                <!-- Os dados entram aqui dinamicamente -->
            </tbody>
        </table>
        
        <!-- Botão de Sair (Logout) -->
        <div style="margin-top: 30px; text-align: right;">
            <button onclick="fazerLogout()" style="background-color: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Sair da Conta</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
